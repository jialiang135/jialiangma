# ============================================
# 个人数字分身 · 多Agent私有RAG系统
# Docker Compose
# ============================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-agent
    ports:
      - "7863:7863"
    environment:
      # 覆盖 .env 中的端口，确保容器内外一致
      - PORT=7863
      - HOST=0.0.0.0
    env_file:
      - config/.env
    volumes:
      # 持久化数据
      - ./assets:/app/assets
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7863/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ============================================
# 个人数字分身 · 多Agent私有RAG系统
# Docker Compose — 生产级编排
# ============================================

services:
  # ========================================
  # FastAPI 后端 + Vue 前端
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-agent
    # 不对外暴露端口，仅内网通过 nginx 访问
    expose:
      - "7863"
    environment:
      - PORT=7863
      - HOST=0.0.0.0
    env_file:
      - config/.env
    volumes:
      # 持久化数据（Chromadb + SQLite + 上传文件）
      - ./assets:/app/assets
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7863/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - agent_net

  # ========================================
  # Nginx 反向代理
  # ========================================
  nginx:
    image: nginx:1.27-alpine
    container_name: personal-agent-nginx
    ports:
      - "8080:80"
      # - "8443:443"  # HTTPS 上线时取消注释
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL 证书目录（上线时取消注释）
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - agent_net

# ========================================
# 命名卷（数据持久化）
# ========================================
volumes:
  app_assets:
    name: personal-agent-assets
  app_logs:
    name: personal-agent-logs

# ========================================
# 内网隔离
# ========================================
networks:
  agent_net:
    name: personal-agent-net
    driver: bridge

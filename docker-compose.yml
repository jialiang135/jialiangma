# ============================================
# 个人数字分身 · 私有 RAG 知识库系统
# Docker Compose — 企业版（含监控/缓存/队列）
# ============================================

services:
  # ========================================
  # FastAPI 后端 + Vue 前端
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-agent
    expose:
      - "7863"
    environment:
      - PORT=7863
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - config/.env
    volumes:
      - ./assets:/app/assets
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7863/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # 上限**必须小于宿主机内存**。原来是 2G，而目标机器就是 2G（实际
          # 1.9G 可用）—— 等于允许 app 一个容器吃光整机，把系统和
          # nginx/redis 一起挤到 OOM。实测该应用常驻约 500~700M，
          # 给 1G 有足够余量，同时留出空间给其它容器和系统。
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent_net

  # ========================================
  # Nginx 反向代理（安全头 + 限流 + HTTPS 终端）
  # ========================================
  nginx:
    image: nginx:1.27-alpine
    container_name: personal-agent-nginx
    ports:
      # 80 给"干净的链接"（http://<ip> 不带端口）；8080 保留兼容。
      # 两个都映射，安全组开哪个都能访问。
      - "80:80"
      - "8080:80"
      # - "443:443"  # HTTPS 上线时取消注释
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro  # Let's Encrypt 证书
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 用 127.0.0.1 而不是 localhost：容器里的 nginx 只监听 IPv4，
      # 而 localhost 会先解析到 IPv6 的 ::1 → 健康检查永远 "Connection refused"，
      # 容器一直是 unhealthy（但服务其实是好的，外网访问正常）。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - agent_net

  # ========================================
  # Redis（会话缓存 + 向量缓存 + 异步队列）
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: personal-agent-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - agent_net

  # ========================================
  # Prometheus 指标采集
  # ========================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: personal-agent-prometheus
    # 默认不启动：Prometheus + Grafana 常驻会占 400~500MB 内存，
    # 小内存机器上不值得。需要看监控时显式拉起：
    #   docker compose --profile monitoring up -d
    profiles: ["monitoring"]
    expose:
      - "9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agent_net

  # ========================================
  # Grafana 监控面板
  # ========================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: personal-agent-grafana
    profiles: ["monitoring"]
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agent_net

# ========================================
# 命名卷（数据持久化）
# ========================================
volumes:
  app_assets:
    name: personal-agent-assets
  app_logs:
    name: personal-agent-logs
  redis_data:
    name: personal-agent-redis-data
  prometheus_data:
    name: personal-agent-prometheus-data
  grafana_data:
    name: personal-agent-grafana-data

# ========================================
# 内网隔离
# ========================================
networks:
  agent_net:
    name: personal-agent-net
    driver: bridge

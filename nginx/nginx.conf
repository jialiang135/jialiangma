# ============================================
# 个人数字分身 · Nginx 反向代理配置
# 用途：HTTPS 终止、静态资源缓存、SSE 流式代理、请求限流
# ============================================

# ⚠️ 动态解析上游，别退回"启动时解析一次"的写法。
#
# `upstream { server app:7863; }` 这种写法只在 nginx **启动时**解析一次 IP 并
# 永久缓存。而每次 `docker compose up -d --build app` 都会重建 app 容器、
# 拿到新 IP —— 之后 nginx 还在往旧 IP 发请求，**全站 502**，直到有人手动
# 重启 nginx。实测踩过：删掉 redis 后 app 的 IP 从 172.18.0.3 变成 172.18.0.2，
# nginx 日志是 "connect() failed (113: Host is unreachable) while connecting
# to upstream"，而 /api/health 从容器内看是好的、宿主机 curl 却 502。
#
# 修法：`resolver` 指向 Docker 内嵌 DNS（127.0.0.11），并给 upstream server
# 加 `resolve`（nginx 1.27.3+ 开源版支持；用 resolve 必须声明 zone）。
# 这样 IP 变化会在 valid=10s 内自动跟上，同时保留 keepalive。
# 改完用 `nginx -t` 验过再 reload —— 配置写错会让 nginx 起不来。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream fastapi_backend {
    zone backend 64k;
    server app:7863 resolve;
    keepalive 32;
}

# 请求限流 —— 防止 API 滥用
# 突发上限 20 req/s，正常 10 req/s
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=2r/s;

# 连接数限制
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;  # 替换为你的域名，如 example.com

    # 客户端上传文件大小限制
    client_max_body_size 100M;

    # ========================================
    # Gzip 压缩
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ========================================
    # 安全响应头
    # ========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================
    # 前端静态资源 —— 长期缓存
    # ========================================
    location /assets/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 静态资源缓存 1 年（Vite 构建产物带 hash）
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # API 路由 —— 代理到 FastAPI
    # ========================================
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # 通用代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 普通 API 限流
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;
    }

    # ========================================
    # SSE 流式对话 —— 禁用缓冲
    # ========================================
    location /api/chat/stream {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;       # 长连接超时
        proxy_send_timeout 600s;

        # 流式响应分块传输
        chunked_transfer_encoding on;

        # 聊天接口独立限流（2 req/s，突发 5）
        limit_req zone=chat_limit burst=5 nodelay;
        limit_conn conn_limit 5;
    }

    # ========================================
    # TTS 语音合成 WebSocket —— 必须显式放行 Upgrade 头
    # ========================================
    # 没有这段时，握手会被 Nginx 当成普通 HTTP 请求转发，
    # 浏览器侧表现为 WebSocket 连接失败（前端"点播放没反应"）。
    # 前缀比 /api/ 更长，按 Nginx 最长前缀匹配规则优先生效。
    location /api/tts/stream {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级的关键三行 —— 缺一不可
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 连接会在一句话合成完到下一句之间的空闲期挂着，
        # 超时太短会在用户思考时把连接掐掉
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;

        limit_conn conn_limit 5;
    }

    # ========================================
    # SPA 前端页面路由
    # ========================================
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # 健康检查（Nginx 自身）
    # ========================================
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}


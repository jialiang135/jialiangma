# ═══════════════════════════════════════════
# CI/CD 流水线 — 简化版（个人轻量服务器）
# 流程：Lint → Test → tar+SSH 部署到阿里云
# ═══════════════════════════════════════════
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 代码质量检查 ───
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check . --ignore=E501,E402,F401,F841 || true

  # ─── 自动化测试 ───
  test:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 2>&1 | tail -3
      - run: pip install pytest pytest-cov pytest-asyncio httpx
      - run: pytest tests/ -v --tb=short || true

  # ─── 自动部署到阿里云轻量服务器 ───
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.ECS_HOST }}" ]; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "⚠️ ECS secrets 未配置，跳过自动部署"
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to ECS
        if: steps.check.outputs.skipped != 'true'
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.ECS_HOST }}
          REMOTE_USER: ${{ secrets.ECS_USER }}
          SOURCE: ""
          TARGET: "/opt/personal-agent"
          EXCLUDE: "config/.env, node_modules, __pycache__, *.pyc, .git, assets, logs, frontend/node_modules, frontend/dist"
          SCRIPT_AFTER: |
            cd /opt/personal-agent
            docker compose up -d --build app
            docker image prune -f
            echo "deploy done ✓"

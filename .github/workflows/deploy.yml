# ═══════════════════════════════════════════
# CI/CD 流水线 — 轻量服务器版（tar+SSH 直推）
# 流程：Lint → Test → 打包源码 → scp 上传 → docker compose 重建
# ═══════════════════════════════════════════
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 代码质量检查 ───
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check . --ignore=E501,E402,F401,F841 || true

  # ─── 自动化测试 ───
  test:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 2>&1 | tail -3
      - run: pip install pytest pytest-cov pytest-asyncio httpx
      - run: pytest tests/ -v --tb=short || true

  # ─── 自动部署到阿里云 ───
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      - name: Pack and deploy
        run: |
          cd ${{ github.workspace }}
          tar czf /tmp/deploy.tar.gz \
            --exclude='config/.env' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.git' \
            --exclude='assets' \
            --exclude='logs' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            api/ core/ config/ agent/ rag/ frontend/ \
            scripts/ nginx/ .github/ \
            requirements.txt Dockerfile docker-compose.yml main.py

          scp -o StrictHostKeyChecking=no /tmp/deploy.tar.gz ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/tmp/deploy.tar.gz

          ssh -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "
            cd /opt/personal-agent
            tar xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz
            docker compose up -d --build app
            docker image prune -f
            echo 'deploy done ✓'
          "

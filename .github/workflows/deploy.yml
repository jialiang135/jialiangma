# ═══════════════════════════════════════════
# CI/CD 流水线（渐进式启用）
# 当前：Lint + Test 自动运行
# 后续：配置 GitHub Secrets 后启用 ACR 推送 + 自动部署
# ═══════════════════════════════════════════
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: personal-agent
  IMAGE_NAME: personal-agent

jobs:
  # ─── 代码质量检查（非阻塞，容忍失败） ───
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check . --ignore=E501,E402,F401,F841 || true

  # ─── 测试（当前测试较少，容忍失败） ───
  test:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 2>&1 | tail -3
      - run: pip install pytest pytest-cov pytest-asyncio httpx
      - run: pytest tests/ -v --tb=short || true

  # ─── 构建推送 ACR（需配置 ACR_USERNAME + ACR_PASSWORD） ───
  build:
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "⚠️ ACR secrets 未配置，跳过镜像构建"
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skipped != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skipped != 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/metadata-action@v5
        if: steps.check.outputs.skipped != 'true'
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skipped != 'true'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 自动部署（需配置 ECS_HOST + ECS_USER + ECS_SSH_KEY） ───
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.ECS_HOST }}" ]; then
            echo "⚠️ ECS secrets 未配置，跳过自动部署"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - uses: appleboy/ssh-action@v1
        if: steps.check.outputs.skipped != 'true'
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd /opt/personal-agent
            git pull
            docker compose up -d --build
            docker image prune -f
